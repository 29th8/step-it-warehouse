services:
  # -------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------
  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - private

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------
  # Next.js Application
  # -------------------------------------------------
  warehouse-app:
    image: ${APP_IMAGE:-step-it-warehouse:local}

    build:
      context: .
      dockerfile: Dockerfile

    container_name: warehouse-app
    restart: unless-stopped

    depends_on:
      warehouse-db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@warehouse-db:5432/${DB_NAME}?schema=public

      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-false}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      CRON_SECRET: ${CRON_SECRET:-}

      HERMES_API_URL: ${HERMES_API_URL:-}
      HERMES_API_TOKEN: ${HERMES_API_TOKEN:-}
      HERMES_TIMEOUT_MS: ${HERMES_TIMEOUT_MS:-8000}

      # Migration duoc chay trong buoc deploy co backup, khong chay khi restart app.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}

      TZ: Asia/Ho_Chi_Minh

    networks:
      - public
      - private

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------
  # Nginx Reverse Proxy
  # -------------------------------------------------
  warehouse-nginx:
    image: nginx:alpine
    container_name: warehouse-nginx
    restart: unless-stopped

    depends_on:
      warehouse-app:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

    networks:
      - public

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------
  # Cron Worker
  # -------------------------------------------------
  warehouse-cron:
    image: alpine:3.19
    container_name: warehouse-cron
    restart: unless-stopped

    depends_on:
      warehouse-app:
        condition: service_healthy

    volumes:
      - ./docker/cron-worker.sh:/app/cron-worker.sh:ro
      - cron_logs:/app/logs

    networks:
      - private

    command: ["sh", "/app/cron-worker.sh"]

    environment:
      TZ: Asia/Ho_Chi_Minh

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # -------------------------------------------------
  # Certbot SSL Auto Renewal
  # -------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: warehouse-certbot

    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :;
      do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"

    networks:
      - public

# -------------------------------------------------
# Volumes
# -------------------------------------------------
volumes:

  postgres_data:
    name: warehouse-postgres-data

  certbot_data:
    name: warehouse-certbot-data

  certbot_certs:
    name: warehouse-certbot-certs

  cron_logs:
    name: warehouse-cron-logs


# -------------------------------------------------
# Networks
# -------------------------------------------------
networks:

  public:
    name: warehouse-public

  private:
    name: warehouse-private
    internal: true
