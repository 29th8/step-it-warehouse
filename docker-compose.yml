# =====================================================
# Docker Compose - Warehouse System Production
# =====================================================
# Usage: docker compose up -d
# =====================================================

services:

  # -------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------
  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------
  # 2. Next.js Application (Web Server)
  # -------------------------------------------------
  warehouse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-app
    restart: unless-stopped
    depends_on:
      warehouse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@warehouse-db:5432/${DB_NAME}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    networks:
      - public
      - private
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------
  # 3. Nginx Reverse Proxy + SSL
  # -------------------------------------------------
  warehouse-nginx:
    image: nginx:alpine
    container_name: warehouse-nginx
    restart: unless-stopped
    depends_on:
      warehouse-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------
  # 4. Cron Worker (Rental Monitoring)
  # -------------------------------------------------
  warehouse-cron:
    image: alpine:3.19
    container_name: warehouse-cron
    restart: unless-stopped
    depends_on:
      warehouse-app:
        condition: service_healthy
    volumes:
      - ./docker/cron-worker.sh:/app/cron-worker.sh:ro
      - cron_logs:/app/logs
    networks:
      - private
    command: ["sh", "/app/cron-worker.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # -------------------------------------------------
  # 5. Certbot (SSL Certificate Renewal)
  # -------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: warehouse-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'"
    networks:
      - public

# =====================================================
# Volumes
# =====================================================
volumes:
  postgres_data:
    name: warehouse-postgres-data
  certbot_data:
    name: warehouse-certbot-data
  certbot_certs:
    name: warehouse-certbot-certs
  cron_logs:
    name: warehouse-cron-logs

# =====================================================
# Networks
# =====================================================
networks:
  public:
    name: warehouse-public
  private:
    name: warehouse-private
    internal: true
