name: CI and deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: warehouse-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Verify, build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        shell: bash
        run: |
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          : "${VPS_APP_PATH:?Missing VPS_APP_PATH}"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Authorize VPS to pull the private image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GHCR_USER' --password-stdin"

      - name: Pull deployment files and deploy exact commit image
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$VPS_APP_PATH" "$GITHUB_SHA" "$DEPLOY_IMAGE" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_PATH=$1
          EXPECTED_COMMIT=$2
          DEPLOY_IMAGE=$3

          cd "$APP_PATH"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "VPS has tracked changes. Deployment stopped to avoid overwriting them." >&2
            exit 10
          fi

          git fetch origin main
          git checkout --detach "$EXPECTED_COMMIT"

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]; then
            echo "VPS commit does not match the image commit." >&2
            exit 11
          fi

          chmod +x scripts/deploy-vps.sh scripts/backup.sh docker/entrypoint.sh
          bash scripts/deploy-vps.sh "$DEPLOY_IMAGE"
          REMOTE_SCRIPT

      - name: Log out from GHCR on VPS
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" docker logout ghcr.io || true
