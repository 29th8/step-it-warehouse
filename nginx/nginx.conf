# ==============================================
# Nginx Reverse Proxy Configuration
# ==============================================
# Ghi chú: Khi chưa có SSL, sử dụng file này.
# Sau khi cài Certbot, thay thế bằng block HTTPS bên dưới.
# ==============================================

# --- GZIP COMPRESSION ---
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/x-javascript
  application/xml
  application/xml+rss
  image/svg+xml;

# --- RATE LIMITING ---
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# --- UPSTREAM ---
upstream nextjs_upstream {
    server warehouse-app:3000;
    keepalive 64;
}

# ==============================================
# HTTP Server (Port 80)
# ==============================================
server {
    listen 80;
    server_name _;

    # Certbot challenge (dùng khi lấy SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Khi chưa có SSL: proxy trực tiếp
    # Khi đã có SSL: bỏ comment dòng return 301 và comment block location /
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}



